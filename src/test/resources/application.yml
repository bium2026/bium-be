spring:
  datasource:
    url: jdbc:h2:mem:bium;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      # 엔티티 매핑으로 테이블을 만들다 실패하면 로그만 남기지 않고 테스트를 실패시킨다
      hibernate.hbm2ddl.halt_on_error: true

  mail:
    host: localhost

notification:
  from: noreply@bium.test
  app-url: http://localhost:5173
  check-cron: "0 */5 * * * *"
  # 테스트에서는 예약 작업을 돌리지 않고 서비스를 직접 부른다
  scheduler-enabled: false

cors:
  allowed-origins: http://localhost:[*],https://*.ngrok-free.app,https://*.ngrok.app,https://*.ngrok-free.dev,https://*.ngrok.dev

jwt:
  secret: test-only-jwt-secret-key-for-bium-tests
  access-token-validity: 1h
  # 액세스 토큰이 만료되면 다시 로그인하지 않고 새 토큰을 받는 리프레시 토큰의 유효 기간. 갱신할 때마다 새로 받는다
  refresh-token-validity: 14d

gemini:
  api-key: test-api-key
  model: gemini-test
  base-url: http://localhost:0
  temperature: 0.55
  connect-timeout: 1s
  read-timeout: 1s

kamis:
  cert-key: test-cert-key
  cert-id: test-cert-id
  base-url: http://localhost:0
  connect-timeout: 1s
  read-timeout: 1s
  # 테스트 중에는 예약 수집과 서버를 켤 때의 수집을 끈다
  collect-cron: "-"
  collect-on-startup: false

nutrition-api:
  service-key: test-service-key
  base-url: http://localhost:0
  page-size: 100
  connect-timeout: 1s
  read-timeout: 1s
  # 통합 테스트는 영양 정보 표가 비어 있다고 보고 만들어서 미리 넣지 않는다
  seed-basic-foods: false

recipe:
  recommendation:
    rate-limit-per-minute: 1000
    global-rate-limit-per-minute: 1000

ingredient-catalog:
  # 통합 테스트는 도감에 사용자가 만든 재료만 있다고 보고 만들어서 기본 재료를 넣지 않는다
  seed-basic-ingredients: false
