spring:
  datasource:
    url: jdbc:h2:mem:bium;MODE=MySQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      # 엔티티 매핑으로 테이블을 만들다 실패하면 로그만 남기지 않고 테스트를 실패시킨다
      hibernate.hbm2ddl.halt_on_error: true

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

jwt:
  secret: test-only-jwt-secret-key-for-bium-tests
  access-token-validity: 1h

gemini:
  api-key: test-api-key
  model: gemini-test
  base-url: http://localhost:0
  temperature: 0.55
  connect-timeout: 1s
  read-timeout: 1s

recipe:
  recommendation:
    rate-limit-per-minute: 1000
    global-rate-limit-per-minute: 1000
