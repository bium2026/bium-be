spring:
  application:
    name: bium
  config:
    # 프로젝트 루트의 .env를 읽는다. 파일이 없으면 넘어가고, OS 환경변수가 .env보다 우선한다
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bium}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

cors:
  # 쉼표로 구분한 프론트 주소 목록
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  # HS256 서명 키, 32바이트 이상 (예: openssl rand -base64 32)
  secret: ${JWT_SECRET}
  access-token-validity: 1h

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com
  temperature: 0.55
  connect-timeout: 5s
  read-timeout: 30s
