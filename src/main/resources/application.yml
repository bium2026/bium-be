spring:
  application:
    name: bium
  config:
    # 프로젝트 루트의 .env를 읽는다. 파일이 없으면 넘어가고, OS 환경변수가 .env보다 우선한다
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bium}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      # 영수증 사진. 휴대폰 사진이 보통 3~8MB라 10MB까지 받는다
      max-file-size: 10MB
      max-request-size: 11MB

cors:
  # 쉼표로 구분한 프론트 주소 목록
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  # HS256 서명 키, 32바이트 이상 (예: openssl rand -base64 32)
  secret: ${JWT_SECRET}
  access-token-validity: 1h

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com
  temperature: 0.55
  connect-timeout: 5s
  read-timeout: 30s

nutrition-api:
  # 공공데이터포털 식약처 식품영양성분 DB 서비스 키. 일반 인증키(Decoding) 값을 넣는다
  service-key: ${NUTRITION_API_KEY:}
  base-url: https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo03
  # 이름 일부만 맞아도 오므로 한 번에 넉넉히 받아 그 안에서 맞는 식품을 고른다.
  # 결과가 한 페이지보다 적으면(마지막 페이지) 응답에 4~6초 걸리고, 꽉 찬 페이지는 1~2초 걸린다.
  # 흔한 재료도 결과가 300개를 넘지 않아서 500개씩 받아 대부분 한 번에 끝낸다
  page-size: 500
  connect-timeout: 2s
  # 결과가 없거나 적은 검색도 4~6초 걸려서 그보다 넉넉히 둔다
  read-timeout: 10s

recipe:
  recommendation:
    # 사용자당 분당 추천 요청 수
    rate-limit-per-minute: ${RECIPE_RECOMMENDATION_RATE_LIMIT:5}
    # 서버 전체 분당 추천 요청 수. Gemini 분당 한도보다 낮게 둔다
    global-rate-limit-per-minute: ${RECIPE_RECOMMENDATION_GLOBAL_RATE_LIMIT:15}

ingredient-catalog:
  # 자주 쓰는 재료(resources/catalog/basic-ingredients.tsv)를 서버를 켤 때 공용 도감에 넣는다
  seed-basic-ingredients: true
